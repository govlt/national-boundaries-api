[project]
name = "national-boundaries-api"
version = "1.0.0"
description = "National Boundaries and Addresses API of Lithuania"
authors = [{ name = "Karolis Vyčius", email = "karolis@vycius.lt" }]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.52.4,<0.53",
    "fastapi-pagination>=0.15.16,<0.16",
    "sqlalchemy>=2.0.52,<3",
    "geoalchemy2>=0.20.0,<0.21",
    "sentry-sdk[fastapi, sqlalchemy]>=2.68.1,<3",
    "sqlean-py>=3.50.4.5,<4",
    "sqlakeyset>=2.0.1787969905,<3",
    "gunicorn>=26.2.0,<27",
    "uvicorn-worker>=0.4.0,<0.5",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22,<0.16",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4.0,<1.5.0",
    "httpx>=0.28.0,<0.29",
]
