name: Continuous integration

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflow files
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
        shell: bash

  ruff-check:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        uses: ./.github/actions/prepare-python-environment

      - name: Lint using ruff
        run: uv run ruff check src --output-format sarif --output-file ruff-results.sarif --target-version py314
        continue-on-error: true

      - name: Upload ESLint analysis results to GitHub
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ruff-results.sarif
          wait-for-processing: true
          category: ruff

  validate-api-docker-build:
    name: Validate if docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      # Registrų Centras blocks US IPs and GitHub runners are US-hosted, so data
      # source downloads go out through a VPN tunnel with an HTTP proxy on top.
      # The runner waits for the container's built-in healthcheck (VPN up) before
      # running any steps. Fork PRs have no secrets, so gluetun never turns
      # healthy and the job fails at startup - same outcome as the proxyless
      # downloads failing, just earlier
      gluetun:
        image: qmcgaw/gluetun:v3.41.3
        env:
          VPN_SERVICE_PROVIDER: ${{ secrets.VPN_SERVICE_PROVIDER }}
          VPN_TYPE: wireguard
          WIREGUARD_PRIVATE_KEY: ${{ secrets.VPN_WIREGUARD_PRIVATE_KEY }}
          SERVER_COUNTRIES: Lithuania
          HTTPPROXY: "on"
          # Give each VPN server 30s to come up instead of the default 6s
          HEALTH_VPN_DURATION_INITIAL: "30s"
        ports:
          - 8888:8888
        # Health flags override the image's single-retry healthcheck: 2min grace
        # period, then 12 more tries - up to ~4min for the VPN to establish
        options: >-
          --cap-add=NET_ADMIN
          --device /dev/net/tun
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 120s
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # Host networking so build RUNs can reach the gluetun proxy on localhost
          driver-opts: network=host

      - name: Build docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          # Build RUNs share the host network so create-database.sh can reach
          # the gluetun HTTP proxy published on the runner's localhost
          allow: network.host
          network: host
          build-args: DATA_SOURCE_PROXY=http://127.0.0.1:8888
          push: false
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  generate-redoc:
    name: Generate ReDoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        uses: ./.github/actions/prepare-python-environment

      - name: Generate openapi.json
        run: uv run python src/extract-openapi.py src.main:app --out openapi.json

      - name: Generate openapi.yaml
        run: uv run python src/extract-openapi.py src.main:app --out openapi.yaml

      - name: Generate ReDoc html
        run: npx @redocly/cli build-docs openapi.yaml --theme.openapi.jsonSampleExpandLevel all

      - name: Upload openapi.yaml artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi.yaml
          path: openapi.yaml
          if-no-files-found: error

      - name: Upload openapi.json artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi.json
          path: openapi.json
          if-no-files-found: error

      - name: Upload redoc-static.html artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redoc-static.html
          path: redoc-static.html
          if-no-files-found: error

      - name: Create dist folder with files
        run: |
          mkdir dist
          cp redoc-static.html dist/index.html
          cp openapi.yaml openapi.json dist

      - name: Upload to Cloudflare pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=national-boundaries-api --commit-dirty=true
