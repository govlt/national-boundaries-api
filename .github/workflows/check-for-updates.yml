name: Check for data source updates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

concurrency: check-for-data-source-updates

jobs:
  create-database:
    name: Create database
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-workflow-create-database.yml
    with:
      max-age-hours: 0
    secrets:
      DATA_SOURCE_PROXY_URL: ${{ secrets.DATA_SOURCE_PROXY_URL }}

  check-for-updates:
    name: Check for updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - create-database
    permissions:
      contents: read
    outputs:
      diff: ${{ steps.comparison.outputs.diff }}
    steps:
      - name: Download database artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database
          path: database

      - name: Upload data-source-checksums.txt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-source-checksums.txt
          path: database/data-sources/data-source-checksums.txt
          if-no-files-found: error

      - name: Upload boundaries.sqlite artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boundaries.sqlite
          path: database/boundaries.sqlite
          if-no-files-found: error

      # A release without assets (failed publish) must not block the next release forever
      - name: Download latest data source hashes
        run: |
          status=$(curl -sSL -o published-data-source-checksums.txt -w '%{http_code}' "https://github.com/govlt/national-boundaries-api/releases/latest/download/data-source-checksums.txt")
          if [ "$status" = 404 ]; then : > published-data-source-checksums.txt; elif [ "$status" != 200 ]; then exit 1; fi

      - name: Upload published-data-source-checksums.txt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-data-source-checksums.txt
          path: published-data-source-checksums.txt
          if-no-files-found: error

      - name: Check that the files are the exact same
        id: comparison
        run: |
          { 
            echo 'diff<<EOF'
            (diff -u 'published-data-source-checksums.txt' 'database/data-sources/data-source-checksums.txt' || :)
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

  create-release:
    name: Create release
    if: ${{ needs.check-for-updates.outputs.diff != '' }}
    concurrency: check-for-data-source-updates-create-release
    needs:
      - check-for-updates
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-workflow-create-release.yml
    with:
      increment: patch
      generate_release_notes: false
      body: |
        Automated release after data source update
        
        ```
        ${{ needs.check-for-updates.outputs.diff }}
        ```
    secrets:
      APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
      APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}
